name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Language Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # Customizing to match your original request
          options: "username=Habel2005&layout=compact&theme=transparent&hide_border=true&title_color=3776AB&text_color=888888"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare files for output
        run: |
          mkdir -p dist
          # The action saves to profile/top-langs.svg by default; move it to dist
          mv profile/top-langs.svg dist/top-langs.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true # This prevents the stats from deleting your snake files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
